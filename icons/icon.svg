<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="116" fill="none" stroke="url(#brand)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Background Decorative Pulse Rings -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.15" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.1" />

  <!-- Glowing Emblem Circle -->
  <circle cx="256" cy="256" r="120" fill="url(#brand)" opacity="0.12" filter="url(#glow)" />
  <circle cx="256" cy="256" r="110" fill="#1e293b" stroke="url(#brand)" stroke-width="6" />

  <!-- Rupee Symbol Symbolizing Finance & Peer Lending -->
  <path d="M 200 180 L 312 180 M 200 216 L 300 216 M 200 180 L 200 270 C 235 270 275 260 275 220 C 275 180 200 180 200 180 Z M 235 268 L 312 342" 
        stroke="url(#brand)" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Growth / Peer arrow indicator -->
  <circle cx="340" cy="180" r="28" fill="url(#gold)" filter="url(#glow)" />
  <path d="M 330 180 L 350 180 M 342 172 L 350 180 L 342 188" stroke="#0f172a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
</svg>
